{% set name = "txid" %}
{% set version = "0.1.3" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  path: ..

build:
  noarch: python
  number: 0
  script: "{{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation"
  entry_points:
    - txid = txid.cli:main

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=69
  run:
    - python >=3.10

test:
  commands:
    - txid --version
    - python -c "import txid; assert txid.__version__ == '{{ version }}'"

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Reference-aware deterministic identities for transcript models
