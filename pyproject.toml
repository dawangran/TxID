[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "txid"
version = "0.1.0"
description = "Reference-aware deterministic identities for transcript models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [{ name = "TxID contributors" }]
keywords = ["long-read RNA-seq", "transcriptome", "GTF", "GFF3"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/dawangran/TxID"
Repository = "https://github.com/dawangran/TxID"
Documentation = "https://github.com/dawangran/TxID/tree/main/docs"
Issues = "https://github.com/dawangran/TxID/issues"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
txid = "txid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/txid" = ["schemas/registry-v1.sql"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
