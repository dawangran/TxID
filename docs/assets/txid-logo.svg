    <path d="M41 70h16m14 0h15"/>
  </g>
  <g fill="#116d65">
    <rect x="29" y="34" width="13" height="16" rx="2"/>
    <rect x="57" y="34" width="14" height="16" rx="2"/>
    <rect x="86" y="34" width="13" height="16" rx="2"/>
    <rect x="25" y="62" width="17" height="16" rx="2"/>
